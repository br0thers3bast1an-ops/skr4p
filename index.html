<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a0d00">
  <title>SKR4P</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;overflow:hidden;width:100%;height:100%;background:#1a0d00}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
    input[type=range]{touch-action:auto}
    #root{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;background:#1a0d00;font-family:'Special Elite',monospace;overflow:hidden}
    #hud{width:100%;max-width:700px;background:linear-gradient(180deg,#2a1500,#1a0d00);border-bottom:3px solid #8B5E1A;padding:5px 8px;display:flex;justify-content:space-around;align-items:center;flex-shrink:0}
    .hstat{color:#f5d77e;display:flex;flex-direction:column;align-items:center;line-height:1.2}
    .hstat span{font-size:8px;color:#a07030;text-transform:uppercase;letter-spacing:1px}
    .hstat b{font-size:13px;font-family:'Rye',serif;color:#ffd700}
    #cvwrap{position:relative;width:100%;max-width:700px;flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center}
    canvas{display:block;image-rendering:auto}
    #overlay,#perkscreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(10,5,0,0.93);color:#f5d77e;padding:12px;text-align:center;overflow-y:auto}
    #perkscreen{display:none}
    #overlay h2{font-family:'Rye',serif;font-size:clamp(20px,5vw,32px);color:#ffd700;text-shadow:0 0 24px #ff8800;letter-spacing:4px}
    #perkscreen h2{font-family:'Rye',serif;font-size:clamp(16px,4vw,20px);color:#ffd700;letter-spacing:2px}
    #overlay p{font-size:clamp(10px,2.5vw,12px);color:#c8a060;max-width:320px;line-height:1.8;font-family:'Special Elite',monospace}
    #startbtn{background:linear-gradient(180deg,#5a2800,#3a1500);border:2px solid #ffd700;color:#ffd700;font-family:'Rye',serif;font-size:clamp(14px,3.5vw,16px);padding:12px 32px;cursor:pointer;border-radius:4px;letter-spacing:2px;margin-top:4px;box-shadow:0 0 12px rgba(255,180,0,0.3);min-height:48px}
    #startbtn:hover,#startbtn:active{background:linear-gradient(180deg,#7a3800,#5a2000)}
    #lbtbl{border-collapse:collapse;font-size:11px;width:240px;font-family:'Special Elite',monospace}
    #lbtbl td{padding:2px 8px;border-bottom:1px solid #4a2a00;color:#a07840}
    #lbtbl td:last-child{color:#ffd700;text-align:right}
    #pcards{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:98vw;padding:0 4px}
    .pcard{background:linear-gradient(180deg,#2a1500,#1a0d00);border:2px solid #7a5a10;color:#f5d77e;padding:10px;cursor:pointer;border-radius:6px;text-align:center;flex:1;min-width:min(110px,26vw);max-width:160px;font-family:'Special Elite',monospace;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .pcard:hover,.pcard:active{background:linear-gradient(180deg,#4a2500,#2a1200);border-color:#ffd700}
    .pcard b{display:block;font-size:clamp(10px,2.5vw,12px);margin-bottom:2px;color:#ffd700;font-family:'Rye',serif}
    .pcard span{font-size:clamp(9px,2vw,10px);color:#b8943e}
    .pcard .pico{font-size:16px;display:block;margin-bottom:3px}
    #controls{width:100%;max-width:700px;background:linear-gradient(180deg,#1a0d00,#0d0600);border-top:3px solid #8B5E1A;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-shrink:0}
    .cbtn{background:linear-gradient(180deg,#2a1500,#1a0800);border:2px solid #8B5E1A;color:#ffd700;font-size:28px;height:clamp(60px,12vw,76px);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;width:clamp(70px,18vw,90px)}
    .cbtn:active{background:linear-gradient(180deg,#4a2500,#2a1200);border-color:#ffd700}
    #shootbtn{background:linear-gradient(180deg,#4a1000,#2a0800);border:2px solid #ffd700;color:#ffd700;font-family:'Rye',serif;font-size:clamp(12px,3vw,15px);height:clamp(60px,12vw,76px);flex:1;border-radius:10px;cursor:pointer;letter-spacing:2px;display:flex;align-items:center;justify-content:center}
    #shootbtn:active{background:linear-gradient(180deg,#8a2000,#4a1000)}
    #banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(20,8,0,0.95);border:2px solid #ffd700;color:#ffd700;font-family:'Rye',serif;font-size:11px;padding:5px 14px;border-radius:20px;display:none;pointer-events:none;z-index:20;white-space:nowrap;letter-spacing:1px;max-width:90vw;text-align:center}
    #muterow{width:100%;max-width:700px;background:#0d0600;padding:4px 10px;display:flex;align-items:center;gap:8px;font-family:'Special Elite',monospace;font-size:10px;color:#a07030;border-top:1px solid #3a1800;flex-shrink:0}
    #mutebtn{background:#1a0d00;border:1px solid #5a3a10;color:#f5d77e;font-family:'Special Elite',monospace;font-size:10px;padding:4px 8px;cursor:pointer;border-radius:3px;min-height:28px;touch-action:auto}
    #vol,#sfxvol{width:60px;accent-color:#ffd700;flex-shrink:0;touch-action:auto}
    @keyframes goldpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.7);border-color:#ffd700}50%{box-shadow:0 0 0 8px rgba(255,215,0,0);border-color:#fff5b0}}
    .gold-nudge{animation:goldpulse 0.7s ease-in-out infinite}
  </style>
</head>
<body>
<div id="root">
  <div id="hud">
    <div class="hstat"><span>Score</span><b id="Hsc">0</b></div>
    <div class="hstat"><span>Wave</span><b id="Hwv">1</b></div>
    <div class="hstat"><span>Lives</span><b id="Hlv">★★★</b></div>
    <div class="hstat"><span>Shield</span><b id="Hsh">--</b></div>
    <div class="hstat"><span>Iron</span><b id="Hgn">REVOLVER</b></div>
  </div>
  <div id="cvwrap">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
    <div id="overlay">
      <h2>SKR4P</h2>
      <p>Arrows / A·D to move &nbsp;·&nbsp; Space to shoot<br>Touch buttons below on mobile<br>Boss every 5 waves &nbsp;·&nbsp; Perks between waves</p>
      <table id="lbtbl"><tbody id="lbbody"></tbody></table>
      <button id="startbtn">DRAW IRON</button>
    </div>
    <div id="perkscreen">
      <h2>Pick Yer Perk</h2>
      <div id="pcards"></div>
    </div>
  </div>
  <div id="controls">
    <button class="cbtn" id="btnL">&#8592;</button>
    <button id="shootbtn">&#9733; FIRE &#9733;</button>
    <button class="cbtn" id="btnR">&#8594;</button>
  </div>
  <div id="muterow">
    <button id="mutebtn">🔊 Mute</button>
    <span>Music</span><input id="vol" type="range" min="0" max="1" step="0.05" value="0.35">
    <span>SFX</span><input id="sfxvol" type="range" min="0" max="1" step="0.05" value="0.6">
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// CANVAS SETUP & RESIZE
// ═══════════════════════════════════════════════════════════════════════════
var cv = document.getElementById('cv');
var CW = 700, CH = 490;
cv.width = CW; cv.height = CH;
var ctx = cv.getContext('2d');

function resizeCanvas() {
  var wrap = document.getElementById('cvwrap');
  var ww = wrap.clientWidth, wh = wrap.clientHeight;
  var scale = Math.min(ww / CW, wh / CH);
  cv.style.width  = Math.round(CW * scale) + 'px';
  cv.style.height = Math.round(CH * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', function(){ setTimeout(resizeCanvas, 200); });
setTimeout(resizeCanvas, 100);
resizeCanvas();

// Block scroll / zoom on game area
document.getElementById('root').addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive: false });
document.addEventListener('touchstart', function(e){
  if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') return;
  if (e.target.id === 'mutebtn') return;
}, { passive: true });

// ═══════════════════════════════════════════════════════════════════════════
// AUDIO ENGINE
// ═══════════════════════════════════════════════════════════════════════════
var AC = null, muted = false, masterVol = 0.35, sfxVol = 0.6;
var musicGain, sfxGain;

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  musicGain = AC.createGain(); musicGain.gain.value = masterVol; musicGain.connect(AC.destination);
  sfxGain   = AC.createGain(); sfxGain.gain.value   = sfxVol;   sfxGain.connect(AC.destination);
}
function resumeAC() { if (AC && AC.state === 'suspended') AC.resume(); }

function osc(type, freq, start, dur, gainVal, dest) {
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(gainVal, start);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g); g.connect(dest); o.start(start); o.stop(start + dur + 0.05);
}
function noise(start, dur, gainVal, dest, ff) {
  var buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1);
  var src = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = ff || 800; f.Q.value = 1.5;
  src.buffer = buf;
  g.gain.setValueAtTime(gainVal, start);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  src.connect(f); f.connect(g); g.connect(dest); src.start(start); src.stop(start + dur + 0.05);
}

function sfxShoot() {
  if (!AC || muted) return;
  var t = AC.currentTime;
  osc('sawtooth', 220, t, 0.04, 0.18, sfxGain);
  noise(t, 0.08, 0.15, sfxGain, 600);
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(1800, t+0.03); o.frequency.exponentialRampToValueAtTime(400, t+0.22);
  g.gain.setValueAtTime(0.08, t+0.03); g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
  o.connect(g); g.connect(sfxGain); o.start(t+0.03); o.stop(t+0.25);
}
function sfxHit() {
  if (!AC || muted) return;
  var t = AC.currentTime;
  noise(t, 0.12, 0.25, sfxGain, 300); osc('sawtooth', 80, t, 0.1, 0.2, sfxGain);
}
function sfxEnemyDie() {
  if (!AC || muted) return;
  var t = AC.currentTime;
  noise(t, 0.07, 0.2, sfxGain, 500); osc('square', 160, t, 0.05, 0.1, sfxGain);
}
function sfxPlayerDie() {
  if (!AC || muted) return;
  var t = AC.currentTime;
  for (var i = 0; i < 4; i++) { osc('sawtooth', 300-i*50, t+i*0.07, 0.2, 0.18, sfxGain); noise(t+i*0.07, 0.18, 0.12, sfxGain, 200+i*100); }
}
function sfxBossDie() {
  if (!AC || muted) return;
  var t = AC.currentTime;
  for (var i = 0; i < 6; i++) { noise(t+i*0.09, 0.25, 0.2, sfxGain, 150+i*80); osc('sawtooth', 200-i*20, t+i*0.09, 0.2, 0.15, sfxGain); }
  [392,494,587,784].forEach(function(f,j){ osc('triangle', f, t+0.6+j*0.1, 0.3, 0.12, sfxGain); });
}
function sfxPickup(type) {
  if (!AC || muted) return;
  var t = AC.currentTime;
  if (type === 'shield') { [523,659,784].forEach(function(f,j){ osc('sine', f, t+j*0.06, 0.18, 0.1, sfxGain); }); }
  else if (type === 'life') { [523,659,784,1046].forEach(function(f,j){ osc('triangle', f, t+j*0.07, 0.2, 0.12, sfxGain); }); }
  else if (type === 'bomb') { osc('square', 110, t, 0.1, 0.15, sfxGain); noise(t, 0.08, 0.18, sfxGain, 400); }
  else { osc('sine', 1046, t, 0.06, 0.1, sfxGain); osc('sine', 1318, t+0.06, 0.08, 0.1, sfxGain); }
}
function sfxNuke() {
  if (!AC || muted) return;
  var t = AC.currentTime;
  noise(t, 0.6, 0.35, sfxGain, 120); osc('sawtooth', 60, t, 0.5, 0.3, sfxGain);
}
function sfxWaveComplete() {
  if (!AC || muted) return;
  var t = AC.currentTime;
  [392,494,587,494,587,784].forEach(function(f,j){ osc('triangle', f, t+j*0.08, 0.15, 0.1, sfxGain); });
}
function sfxBossWarning() {
  if (!AC || muted) return;
  var t = AC.currentTime;
  for (var i = 0; i < 3; i++) { osc('sawtooth', 55, t+i*0.22, 0.18, 0.2, sfxGain); osc('square', 110, t+i*0.22, 0.15, 0.1, sfxGain); }
}

// ── Background music ──────────────────────────────────────────────────────
var PENTA = [220,440,261,294,330,392,523,587,659,784];
var BASS  = [55,73,82,87,98,110];
var bgInterval = null, bgBeat = 0, bgPattern = [], harmInterval = null;

function buildPattern() {
  bgPattern = [
    {n:PENTA[1],dur:0.18,vol:0.07},{n:0},
    {n:PENTA[3],dur:0.12,vol:0.06},{n:PENTA[2],dur:0.12,vol:0.05},
    {n:PENTA[4],dur:0.22,vol:0.08},{n:0},
    {n:PENTA[3],dur:0.14,vol:0.06},{n:0},
    {n:PENTA[6],dur:0.18,vol:0.07},{n:PENTA[4],dur:0.12,vol:0.06},
    {n:PENTA[3],dur:0.12,vol:0.05},{n:0},
    {n:PENTA[2],dur:0.22,vol:0.07},{n:0},
    {n:PENTA[1],dur:0.14,vol:0.06},{n:0}
  ];
}
function playBeat() {
  if (!AC || muted || !running) return;
  var t = AC.currentTime, step = bgPattern[bgBeat % bgPattern.length];
  if (step.n) {
    var o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),mg=AC.createGain(),mg2=AC.createGain();
    o1.type='triangle'; o1.frequency.value=step.n;
    o2.type='sine'; o2.frequency.value=step.n*2.01;
    mg.gain.value=0.4; mg2.gain.value=0.6;
    o1.connect(mg); o2.connect(mg2); mg.connect(g); mg2.connect(g);
    g.gain.setValueAtTime(step.vol,t); g.gain.setValueAtTime(step.vol*0.6,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+step.dur);
    g.connect(musicGain); o1.start(t); o1.stop(t+step.dur+0.05); o2.start(t); o2.stop(t+step.dur+0.05);
  }
  if (bgBeat%4===0) {
    var bf=BASS[Math.floor(bgBeat/4)%BASS.length];
    osc('sine',bf,t,0.22,0.12,musicGain);
    var ko=AC.createOscillator(),kg=AC.createGain();
    ko.type='sine'; ko.frequency.setValueAtTime(140,t); ko.frequency.exponentialRampToValueAtTime(40,t+0.08);
    kg.gain.setValueAtTime(0.18,t); kg.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    ko.connect(kg); kg.connect(musicGain); ko.start(t); ko.stop(t+0.15);
  }
  if (bgBeat%2===1) noise(t,0.04,0.03,musicGain,8000);
  if (bgBeat%8===4||bgBeat%8===7) { noise(t,0.08,0.06,musicGain,1200); osc('square',180,t,0.05,0.04,musicGain); }
  bgBeat++;
}
function playHarmonica() {
  if (!AC || muted || !running) return;
  var t = AC.currentTime;
  [330,370,392,440,370,330,294].forEach(function(f,j){
    var o=AC.createOscillator(),g=AC.createGain(),vib=AC.createOscillator();
    o.type='sawtooth'; o.frequency.value=f;
    vib.type='sine'; vib.frequency.value=5+Math.random()*2;
    var vibG=AC.createGain(); vibG.gain.value=f*0.012;
    vib.connect(vibG); vibG.connect(o.frequency);
    g.gain.setValueAtTime(0,t+j*0.18); g.gain.linearRampToValueAtTime(0.04,t+j*0.18+0.04);
    g.gain.setValueAtTime(0.04,t+j*0.18+0.12); g.gain.exponentialRampToValueAtTime(0.0001,t+j*0.18+0.22);
    var filt=AC.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=f*1.5; filt.Q.value=3;
    o.connect(filt); filt.connect(g); g.connect(musicGain);
    o.start(t+j*0.18); o.stop(t+j*0.18+0.25); vib.start(t+j*0.18); vib.stop(t+j*0.18+0.25);
  });
}
function startMusic() {
  if (bgInterval) return;
  buildPattern(); bgBeat=0;
  bgInterval = setInterval(playBeat, 160);
  harmInterval = setInterval(playHarmonica, 12000+Math.random()*6000);
  setTimeout(playHarmonica, 2000);
}
function stopMusic() {
  clearInterval(bgInterval); bgInterval=null;
  clearInterval(harmInterval); harmInterval=null;
}

// ═══════════════════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════════════════
var W=700, H=490, running=false, tick=0, bannerTick=0, gameInterval=null;
var kb={}, touch={left:false,right:false,shoot:false}, scores=[];
var fireIntensity=0;
var MAX_SHIELD=420, lastShotTick=-99;

var allies=[];
function initAllies(){
  allies=[];
  [60,160,280,420,540,640].forEach(function(x){
    allies.push({x:x,y:H-42,fi:0,shootCD:1000+Math.floor(Math.random()*1500),bullets:[],upgrade:null});
  });
}

var PERKS=[
  {id:'spread',   n:'Spread Shot',   d:'3-bullet fan (side shots -30% dmg)', ico:'🔱',stack:false},
  {id:'speed',    n:'Quick Draw',    d:'Fire 40% faster (stacks)',         ico:'⚡',stack:true},
  {id:'pierce',   n:'Silver Bullet', d:'Bullets pierce enemies',           ico:'🔫',stack:false},
  {id:'big',      n:'Cannonball',    d:'2x bullet size & damage',          ico:'💣',stack:false},
  {id:'magnet',   n:'Lasso Pull',    d:'Pickups pulled to you',            ico:'🧲',stack:false},
  {id:'life',     n:'Second Wind',   d:'+1 life (up to 9)',                ico:'❤️',stack:true},
  {id:'slow',     n:'Molasses Hex',  d:'Enemies 25% slower (stacks)',      ico:'🐌',stack:true},
  {id:'bounce',   n:'Ricochet',      d:'Bullets bounce twice & hit harder',ico:'↔️',stack:false},
  {id:'triple',   n:'Triple Tap',    d:'3-shot fanned burst, fires faster',ico:'🎯',stack:false},
  {id:'ghost',    n:'Ghost Round',   d:'Bullets pass through all',         ico:'👻',stack:false},
  {id:'fury',     n:'Outlaw Fury',   d:'2x fire rate (stacks)',            ico:'🔥',stack:true},
  {id:'backstep', n:'Sidestep',      d:'Move 50% faster (stacks)',         ico:'💨',stack:true},
  {id:'multishot',n:'Buckshot',      d:'5-bullet wide spread',             ico:'💥',stack:false},
  {id:'homing',   n:'Bloodhound',    d:'Slight bullet curve to enemies',   ico:'🎪',stack:false},
  {id:'nuke',     n:'Dynamite',      d:'Screen-clear bomb (N key)',        ico:'🧨',stack:true},
  {id:'leech',    n:'Soul Harvest',  d:'Score 50% more per kill (stacks)', ico:'💀',stack:true},
  {id:'tough',    n:'Iron Hide',     d:'Absorb 1 extra hit',              ico:'🛡',stack:true},
];

var px,py,bullets,ebullets,enemies,drops,perks,perkCounts;
var score,wave,lives,mutlv,shieldT,fireCD,flash,shake,boss,waveOver;
var toughHP,nukeCount,goldBank,leechStack,slowStack,speedStack,furyStack,stepStack,burstQueue,burstTimer;
var bossCountdown=0, goldNudgeShown=false, goldFirstNudgeTick=0;

var stars=[];
for(var i=0;i<120;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.75,sp:0.02+Math.random()*0.05,r:Math.random()<0.12?2:1});
var tumbleweeds=[];
for(var i=0;i<3;i++) tumbleweeds.push({x:Math.random()*W,y:H-28-Math.random()*20,spd:0.4+Math.random()*0.5,r:7+Math.random()*7,a:0,dir:Math.random()<0.5?1:-1});

function hp(id){ return perks.indexOf(id)>=0; }

function reset(){
  px=W/2; py=H-58;
  bullets=[];ebullets=[];enemies=[];drops=[];perks=[];perkCounts={};
  score=0;wave=1;lives=3;mutlv=0;
  shieldT=0;fireCD=0;flash=0;shake=0;boss=null;waveOver=false;
  toughHP=0;nukeCount=0;goldBank=0;leechStack=0;slowStack=0;speedStack=0;furyStack=0;stepStack=0;
  burstQueue=0;burstTimer=0;lastShotTick=-99;
  bossCountdown=0;goldNudgeShown=false;goldFirstNudgeTick=0;
  tick=0;fireIntensity=0;
  initAllies(); spawnWave(); hud();
}

function spawnWave(){
  enemies=[];ebullets=[];boss=null;waveOver=false;
  if(wave%5===0){ bossCountdown=600; showBanner('⚠ BOSS INCOMING ⚠'); sfxBossWarning(); return; }
  var rows=Math.min(2+Math.floor(wave/2),6), cols=Math.min(6+Math.floor(wave/3),12), gx=(W-80)/cols;
  for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
    var tier=r<2?0:r<4?1:2, h=1+tier+(mutlv>2?1:0), spd=(0.5+wave*0.07)*(c%2===0?1:-1), seed=(r*100+c*7+wave*13)%100;
    enemies.push({x:40+c*gx+gx/2,y:34+r*44,hp:h,mhp:h,tier:tier,spd:spd,fcd:60+Math.random()*100,ph:Math.random()*6.28,seed:seed});
  }
}
function spawnBoss(){
  var tier=Math.floor(wave/5), h=Math.round(20 + tier*14 + tier*tier*3);
  boss={x:W/2,y:90,hp:h,mhp:h,ph:0,fcd:30,frate:Math.max(18,52-tier*4),pat:tier%3};
}


function buildVolley(){
  var bArr=[], baseAngles=[0], baseDmg=[1];
  if(hp('multishot')){ baseAngles=[-0.4,-0.2,0,0.2,0.4]; baseDmg=[0.85,0.85,1,0.85,0.85]; }
  else if(hp('spread')){ baseAngles=[-0.22,0,0.22]; baseDmg=[0.7,1,0.7]; }
  for(var i=0;i<baseAngles.length;i++)
    bArr.push({x:px,y:py-30,dx:Math.sin(baseAngles[i])*4,dy:-10,bc:0,homing:hp('homing'),dmgMul:baseDmg[i]});
  return bArr;
}
function shootP(){ var v=buildVolley(); for(var i=0;i<v.length;i++) bullets.push(v[i]); if(tick-lastShotTick>4){ sfxShoot(); lastShotTick=tick; } }
function triggerBurst(){ burstQueue=2; burstTimer=4; }

function eFire(e){
  e.fcd--; if(e.fcd>0) return;
  var rate=Math.max(20,72-wave*2)*(1+slowStack*0.4);
  e.fcd=rate*(0.6+Math.random()*0.8);
  if(mutlv>=3){ for(var i=0;i<4;i++){ var a=i*1.5708+tick*0.012; ebullets.push({x:e.x,y:e.y,dx:Math.cos(a)*2.6,dy:Math.sin(a)*2.6}); } }
  else if(mutlv>=2){ [-0.28,0,0.28].forEach(function(a){ ebullets.push({x:e.x,y:e.y,dx:Math.sin(a)*2,dy:3.2}); }); }
  else if(mutlv>=1){ [-0.18,0.18].forEach(function(a){ ebullets.push({x:e.x,y:e.y,dx:Math.sin(a)*2,dy:3}); }); }
  else ebullets.push({x:e.x,y:e.y,dx:(Math.random()-0.5)*1.5,dy:3.2});
}
function bFire(){
  if(!boss) return; boss.fcd--; if(boss.fcd>0) return; boss.fcd=boss.frate;
  if(boss.pat===0){ for(var i=0;i<8;i++){ var a=i*0.7854+tick*0.004; ebullets.push({x:boss.x,y:boss.y,dx:Math.cos(a)*3,dy:Math.sin(a)*3}); } }
  else if(boss.pat===1){ for(var j=-2;j<=2;j++) ebullets.push({x:boss.x,y:boss.y,dx:j*1.4,dy:4}); }
  else { var ang=Math.atan2(py-boss.y,px-boss.x); for(var k=-1;k<=1;k++) ebullets.push({x:boss.x,y:boss.y,dx:Math.cos(ang+k*0.2)*4,dy:Math.sin(ang+k*0.2)*4}); }
}

function shieldDropRate(){ return 0.05*Math.pow(0.5,Math.max(0,wave-1)); }
function dropItem(x,y){
  var r=Math.random();
  var sdr=shieldDropRate();
  var lt=0.065, st=lt+sdr, bt=st+0.06, gt=bt+0.05;
  if(r<lt)  drops.push({x:x,y:y,type:'life',  t:380,ico:'❤'});
  else if(r<st) drops.push({x:x,y:y,type:'shield',t:380,ico:'S'});
  else if(r<bt) drops.push({x:x,y:y,type:'bomb',  t:380,ico:'B'});
  else if(r<gt) drops.push({x:x,y:y,type:'score', t:380,ico:'$'});
}
function d2(ax,ay,bx,by){ var dx=ax-bx,dy=ay-by; return dx*dx+dy*dy; }

function nukeClear(){
  var killed=0;
  for(var i=enemies.length-1;i>=0;i--){ score+=Math.round(waveBaseScore(wave)*Math.min(2,1+leechStack*0.5)); killed++; enemies.splice(i,1); }
  if(boss){ score+=300; boss.hp=Math.ceil(boss.hp/2); }
  sfxNuke(); flash=20; shake=14; showBanner('DYNAMITE! '+killed+' SCRAPPERS CLEARED!'); hud();
}

// ── ALLY UPGRADE SYSTEM ──────────────────────────────────────────────────
// Three Tier 1 upgrades per ally; costs 1 gold token each.
// Faster Fuse: halves shoot cooldown
// Aimed Shot:  targets highest-HP enemy instead of nearest
// Ember Spread: fires 3-way fan instead of 1 shot
var ALLY_UPGRADES=[
  {id:'fuse',   n:'Faster Fuse',   d:'Shoots twice as often',       ico:'🔥'},
  {id:'aimed',  n:'Aimed Shot',    d:'Targets highest-HP enemy',    ico:'🎯'},
  {id:'spread', n:'Ember Spread',  d:'3-shot fan per volley',        ico:'🌟'},
];

function nearestAlly(){
  var best=null,bestD=99999;
  for(var i=0;i<allies.length;i++){
    var dd=d2(px,py,allies[i].x,allies[i].y);
    if(dd<bestD){bestD=dd;best=i;}
  }
  return best;
}

function upgradeAlly(idx){
  if(goldBank<=0){showBanner('NO GOLD — collect gold drops first!');return;}
  var al=allies[idx];
  if(al.upgrade){showBanner('ALLY ALREADY UPGRADED!');return;}
  // Offer 3 upgrade choices via banner; cycle on repeated press
  if(!al._upgradeChoice) al._upgradeChoice=0;
  var up=ALLY_UPGRADES[al._upgradeChoice];
  al._upgradeChoice=(al._upgradeChoice+1)%ALLY_UPGRADES.length;
  // Confirm on third press back to same choice, or just apply immediately
  al.upgrade=up.id;
  goldBank--;
  // Apply upgrade effects
  if(up.id==='fuse')   al.shootCD=Math.round(al.shootCD*0.5);
  al.fi=1.0; // flash to show upgrade applied
  showBanner('ALLY UPGRADED: '+up.n+' — '+goldBank+' gold left');
  hud();
}

function updateAllies(){
  for(var i=0;i<allies.length;i++){
    var al=allies[i]; al.shootCD--; al.fi=Math.max(0,al.fi-0.05);
    if(al.shootCD<=0){
      al.fi=1.0;
      // Faster Fuse: halved cooldown range
      al.shootCD=al.upgrade==='fuse'
        ? 500+Math.floor(Math.random()*750)
        : 1000+Math.floor(Math.random()*1500);
      // Aimed Shot: pick highest-HP enemy; default: nearest
      var target=null,bestVal=al.upgrade==='aimed'?-1:999999;
      for(var j=0;j<enemies.length;j++){
        var dd=d2(al.x,al.y,enemies[j].x,enemies[j].y);
        var val=al.upgrade==='aimed'?enemies[j].hp:dd;
        if(al.upgrade==='aimed'?(val>bestVal):(val<bestVal)){bestVal=val;target=enemies[j];}
      }
      if(boss){ var dd=d2(al.x,al.y,boss.x,boss.y); if(al.upgrade!=='aimed'&&dd<bestVal) target=boss; else if(al.upgrade==='aimed') target=boss; }
      if(target){
        var ang=Math.atan2(target.y-al.y,target.x-al.x);
        if(al.upgrade==='spread'){
          // Ember Spread: 3-shot fan
          [-0.22,0,0.22].forEach(function(offset){
            al.bullets.push({x:al.x,y:al.y-18,dx:Math.cos(ang+offset)*6,dy:Math.sin(ang+offset)*6,life:80});
          });
        } else {
          al.bullets.push({x:al.x,y:al.y-18,dx:Math.cos(ang)*6,dy:Math.sin(ang)*6,life:80});
        }
      } else al.bullets.push({x:al.x,y:al.y-18,dx:0,dy:-7,life:80});
    }
    var nb=[];
    for(var j=0;j<al.bullets.length;j++){
      var b=al.bullets[j]; b.x+=b.dx; b.y+=b.dy; b.life--;
      if(b.life<=0||b.y<-10||b.x<0||b.x>W) continue;
      var hit=false;
      if(boss&&d2(b.x,b.y,boss.x,boss.y)<54*54){ boss.hp-=1; score+=Math.round(waveBaseScore(wave)*2); shake=2; if(boss.hp<=0){score+=Math.round(800+wave*30+wave*wave*0.8);dropItem(boss.x,boss.y);sfxBossDie();boss=null;openPerks();return;} hit=true; }
      if(!hit){ for(var k=0;k<enemies.length;k++){ if(d2(b.x,b.y,enemies[k].x,enemies[k].y)<16*16){ enemies[k].hp-=1; score+=Math.round(waveBaseScore(wave)*Math.min(2,1+leechStack*0.5)); if(enemies[k].hp<=0){sfxEnemyDie();dropItem(enemies[k].x,enemies[k].y);enemies.splice(k,1);} hit=true; break; } } }
      if(!hit) nb.push(b);
    }
    al.bullets=nb;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════════════════════
function update(){
  tick++;
  if(shake>0)shake--;if(flash>0)flash--;if(fireCD>0)fireCD--;
  if(bannerTick>0){bannerTick--;if(bannerTick===0)document.getElementById('banner').style.display='none';}

  tumbleweeds.forEach(function(tw){tw.x+=tw.spd*tw.dir;tw.a+=0.04*tw.dir;if(tw.x<-20)tw.x=W+20;if(tw.x>W+20)tw.x=-20;});

  var goLeft  = touch.left  || kb['ArrowLeft']  || kb['KeyA'];
  var goRight = touch.right || kb['ArrowRight'] || kb['KeyD'];
  var goShoot = touch.shoot || kb['Space']      || kb['ArrowUp'];

  if(goShoot) fireIntensity=Math.min(1,fireIntensity+0.12);
  else        fireIntensity=Math.max(0,fireIntensity-0.05);

  var spd=4+stepStack*2;
  if(goLeft)  px=Math.max(16,px-spd);
  if(goRight) px=Math.min(W-16,px+spd);

  {
    // Diminishing returns: each speed stack gives 4/3/2/2/2... frames, each fury 6/5/4/3/3...
    var speedBonus=0; for(var _s=0;_s<speedStack;_s++) speedBonus+=Math.max(2,4-Math.floor(_s/2));
    var furyBonus=0;  for(var _f=0;_f<furyStack;_f++)  furyBonus+=Math.max(3,6-_f);
    var tripleBonus=hp('triple')?4:0;
    var fr=Math.max(6,30-speedBonus-furyBonus-tripleBonus);
    if(goShoot&&fireCD<=0){ shootP(); if(hp('triple'))triggerBurst(); fireCD=fr; }
    if(burstQueue>0){burstTimer--;if(burstTimer<=0){shootP();burstQueue--;burstTimer=4;}}
  }
  if(shieldT>0) shieldT--;

  // homing
  if(hp('homing')){
    var cc=0;if(hp('spread'))cc++;if(hp('multishot'))cc++;if(hp('triple'))cc++;if(hp('big'))cc++;if(hp('pierce'))cc++;if(hp('ghost'))cc++;cc+=speedStack;cc+=furyStack;
    var cs=0.35/Math.max(1,1+cc*0.55), ms=Math.max(5.5,9-cc*0.6);
    for(var i=0;i<bullets.length;i++){
      var b=bullets[i]; if(!b.homing) continue;
      var tgt=boss||(enemies.length?enemies[0]:null); if(!tgt) continue;
      var ddx=tgt.x-b.x,ddy=tgt.y-b.y,dl=Math.sqrt(ddx*ddx+ddy*ddy);
      if(dl>0){b.dx+=ddx/dl*cs;b.dy+=ddy/dl*cs;var sp2=Math.sqrt(b.dx*b.dx+b.dy*b.dy);if(sp2>ms){b.dx=b.dx/sp2*ms;b.dy=b.dy/sp2*ms;}}
    }
  }

  var nb=[];
  for(var i=0;i<bullets.length;i++){
    var b=bullets[i]; b.x+=b.dx; b.y+=b.dy;
    if(hp('bounce')&&(b.bc||0)<2&&(b.x<0||b.x>W)){ b.dx*=-1; b.bc=(b.bc||0)+1; }
    if(b.y<-10||b.x<-10||b.x>W+10) continue;
    var used=false,dmg=(hp('big')?2:1)*(b.dmgMul||1)*((b.bc||0)>0?1.25:1),pierce=hp('pierce')||hp('ghost');
    if(boss){
      if(d2(b.x,b.y,boss.x,boss.y)<54*54){
        boss.hp-=dmg;score+=Math.round(waveBaseScore(wave)*4);shake=4;
        if(boss.hp<=0){score+=Math.round(800+wave*30+wave*wave*0.8);dropItem(boss.x,boss.y);dropItem(boss.x-24,boss.y+10);sfxBossDie();boss=null;openPerks();return;}
        if(!pierce) used=true;
      }
    } else {
      for(var j=0;j<enemies.length;j++){
        if(d2(b.x,b.y,enemies[j].x,enemies[j].y)<16*16){
          enemies[j].hp-=dmg; score+=Math.round(waveBaseScore(wave)*Math.min(2,1+leechStack*0.5));
          if(enemies[j].hp<=0){sfxEnemyDie();dropItem(enemies[j].x,enemies[j].y);enemies.splice(j,1);j--;}
          if(!pierce){used=true;break;}
        }
      }
    }
    if(!used) nb.push(b);
  }
  bullets=nb;

  var neb=[];
  for(var i=0;i<ebullets.length;i++){
    var eb=ebullets[i]; eb.x+=eb.dx; eb.y+=eb.dy;
    if(eb.x<0||eb.x>W||eb.y>H+10||eb.y<-10) continue;
    var blocked=false;
    if(shieldT>0&&d2(eb.x,eb.y,px,py)<32*32) blocked=true;
    else if(d2(eb.x,eb.y,px,py)<15*15){
      flash=14;shake=9;sfxHit();
      if(toughHP>0){toughHP--;showBanner('IRON HIDE ABSORBS HIT ('+toughHP+' left)');hud();}
      else{lives--;hud();if(lives<=0){sfxPlayerDie();endGame();return;}}
      blocked=true;
    }
    if(!blocked) neb.push(eb);
  }
  ebullets=neb;

  if(boss){
    boss.ph+=0.02;boss.x=W/2+Math.sin(boss.ph)*170;boss.y=85+Math.sin(boss.ph*0.6)*20;bFire();
  } else if(bossCountdown>0){
    bossCountdown--;
    var secsLeft=Math.ceil(bossCountdown/60);
    if(bossCountdown%60===0 && secsLeft>0){ showBanner('⚠ BOSS INCOMING — '+secsLeft+'s ⚠'); if(secsLeft<=3) sfxBossWarning(); }
    if(bossCountdown<=0){ spawnBoss(); showBanner('⚔ BOSS WAVE ⚔'); }
  } else {
    if(enemies.length===0&&!waveOver){waveOver=true;sfxWaveComplete();openPerks();return;}
    var minX=W,maxX=0;
    for(var i=0;i<enemies.length;i++){if(enemies[i].x<minX)minX=enemies[i].x;if(enemies[i].x>maxX)maxX=enemies[i].x;}
    var bounced=minX<20||maxX>W-20, sm=Math.max(0.25,1-slowStack*0.25);
    for(var i=0;i<enemies.length;i++){
      var e=enemies[i];
      if(bounced){e.spd*=-1;e.y+=16;}
      e.x+=e.spd*sm;
      if(mutlv>=1) e.y+=Math.sin(tick*0.04+e.ph)*0.28;
      if(e.y>H-40){lives--;hud();enemies.splice(i,1);i--;if(lives<=0){sfxPlayerDie();endGame();return;}}
      eFire(e);
    }
  }

  updateAllies();

  var nd=[];
  for(var i=0;i<drops.length;i++){
    var d=drops[i]; d.y+=1.4; d.t--;
    if(hp('magnet')){var ddx=px-d.x,ddy=py-d.y,dl=Math.sqrt(ddx*ddx+ddy*ddy);if(dl<150){d.x+=ddx/dl*4;d.y+=ddy/dl*4;}}
    if(d2(d.x,d.y,px,py)<20*20){
      sfxPickup(d.type);
      if(d.type==='life'&&lives<9){lives++;showBanner('+1 LIFE');}
      else if(d.type==='shield'){shieldT=MAX_SHIELD;showBanner('SHIELD ON');}
      else if(d.type==='bomb'){nukeCount++;showBanner('DYNAMITE x'+nukeCount+' — press N!');}
      else if(d.type==='score'){
        goldBank++;
        if(!goldNudgeShown){
          goldNudgeShown=true;
          showBanner('🪙 GOLD! Tap the 🔧 button (or press U) to upgrade an ally turret!');
          bannerTick=240;
          goldFirstNudgeTick=16;
        } else {
          showBanner('GOLD! '+goldBank+' in bank — upgrade an ally via U key or 🔧');
        }
      }
      hud(); continue;
    }
    if(d.y<H+20&&d.t>0) nd.push(d);
  }
  drops=nd;
}

// DRAW HELPERS

function waveBaseScore(w){ return 10+Math.floor(w*0.7+Math.sqrt(w)*2); }

function drawTrashBag(x,y,ratio,mut,seed){
  var wobble=Math.sin(tick*0.06+seed)*1.2;
  var col=mut>=4?'#3a1a5a':mut>=2?'#2a1a3a':'#1a1a2a';
  var sheen=mut>=4?'#8844cc':mut>=2?'#442266':'#333355';
  ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x+wobble,y+2,14,16,wobble*0.04,0,6.28); ctx.fill();
  ctx.fillStyle=sheen; ctx.beginPath(); ctx.ellipse(x-3+wobble,y-2,5,8,0.3,0,6.28); ctx.fill();
  ctx.strokeStyle=ratio<0.5?'#ff4444':'#888888'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-5+wobble,y-14); ctx.bezierCurveTo(x-3+wobble,y-18,x+3+wobble,y-18,x+5+wobble,y-14); ctx.stroke();
  ctx.fillStyle=ratio<0.5?'#ff6666':'#aaaaaa'; ctx.beginPath(); ctx.arc(x+wobble,y-15,2.5,0,6.28); ctx.fill();
  if(ratio<0.5){ ctx.fillStyle='rgba(0,200,50,0.7)'; ctx.beginPath(); ctx.ellipse(x+4+wobble,y+14,2,4,0,0,6.28); ctx.fill(); }
  if(mut>0){ ctx.strokeStyle='rgba(180,60,255,'+(0.3+mut*0.08)+')'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(x+wobble,y+2,17,19,0,0,6.28); ctx.stroke(); }
  ctx.fillStyle=ratio<0.5?'#ff3300':'#ffcc00';
  ctx.beginPath(); ctx.arc(x-4+wobble,y-2,2,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(x+4+wobble,y-2,2,0,6.28); ctx.fill();
}

function drawTinCan(x,y,ratio,mut,seed){
  var tilt=Math.sin(tick*0.05+seed)*1.5;
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt*0.04);
  var col=mut>=4?'#884400':mut>=2?'#664422':'#8B7355';
  var cg=ctx.createLinearGradient(-10,0,10,0);
  cg.addColorStop(0,'#555'); cg.addColorStop(0.3,col); cg.addColorStop(0.6,'#aaa'); cg.addColorStop(1,'#444');
  ctx.fillStyle=cg; ctx.fillRect(-10,-14,20,26);
  ctx.fillStyle='#888'; ctx.beginPath(); ctx.ellipse(0,-14,10,3,0,0,6.28); ctx.fill();
  ctx.fillStyle='#666'; ctx.beginPath(); ctx.ellipse(0,12,10,3,0,0,6.28); ctx.fill();
  ctx.fillStyle=ratio<0.5?'#8B0000':'#cc2200'; ctx.fillRect(-9,-8,16,10);
  ctx.fillStyle=ratio<0.5?'#ff4444':'#ffaaaa'; ctx.font='bold 5px monospace'; ctx.textAlign='center'; ctx.fillText('SKR4P',0,-1);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(6,-3,4,5,0.4,0,6.28); ctx.fill();
  ctx.fillStyle=ratio<0.5?'#ff0000':'#ffcc00';
  ctx.beginPath(); ctx.arc(-4,-10,2,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-10,2,0,6.28); ctx.fill();
  if(mut>0){ ctx.strokeStyle='rgba(255,100,0,'+(0.3+mut*0.08)+')'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(0,-1,13,17,0,0,6.28); ctx.stroke(); }
  ctx.restore();
}

function drawCardboardBox(x,y,ratio,mut,seed){
  var sag=Math.sin(tick*0.04+seed);
  var col=mut>=4?'#4a2a6a':mut>=2?'#5a3a1a':'#8B6914';
  var dark=mut>=4?'#2a0a3a':mut>=2?'#3a1a00':'#6B4914';
  ctx.fillStyle=col; ctx.fillRect(x-13,y-10+sag,26,22);
  ctx.fillStyle=dark; ctx.fillRect(x-13,y-10+sag,26,4); ctx.fillRect(x+7,y-10+sag,6,22);
  ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1;
  for(var i=0;i<4;i++){ctx.beginPath();ctx.moveTo(x-13,y-8+i*5+sag);ctx.lineTo(x+13,y-8+i*5+sag);ctx.stroke();}
  ctx.fillStyle=col;
  ctx.save(); ctx.translate(x-7,y-10+sag); ctx.rotate(-0.4+sag*0.05); ctx.fillRect(-6,0,12,-10); ctx.restore();
  ctx.save(); ctx.translate(x+7,y-10+sag); ctx.rotate(0.4+sag*0.05);  ctx.fillRect(-6,0,12,-10); ctx.restore();
  ctx.fillStyle='rgba(100,180,100,0.8)'; ctx.fillRect(x-8,y+8+sag,4,6);
  ctx.fillStyle='rgba(220,220,180,0.7)'; ctx.beginPath(); ctx.arc(x+4,y+10+sag,4,0,6.28); ctx.fill();
  if(ratio<0.5){
    ctx.strokeStyle='#ff4400'; ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x-7,y-4+sag);ctx.lineTo(x-3,y+sag);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-3,y-4+sag);ctx.lineTo(x-7,y+sag);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+3,y-4+sag);ctx.lineTo(x+7,y+sag);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+7,y-4+sag);ctx.lineTo(x+3,y+sag);ctx.stroke();
  } else {

  }
  ctx.strokeStyle=ratio<0.5?'#ff6600':'#884400'; ctx.lineWidth=1.5; ctx.lineCap='round';

function drawEnemy(e){

  else if(e.tier===1)  drawTinCan(e.x,e.y,e.hp/e.mhp,mutlv,e.seed);

  ctx.fillStyle='#111'; ctx.beginPath(); ctx.ellipse(bx-12,by-2,7,6,0,0,6.28); ctx.fill(); ctx.beginPath(); ctx.ellipse(bx+12,by-2,7,6,0,0,6.28); ctx.fill();

function flameTongue(cx,cy,w,h,lean,col1,col2,sw){
  var sway=sw!==undefined?sw:Math.sin(tick*0.07+cx*0.005);
  var ox=lean+sway*(w*0.12);
  var grad=ctx.createLinearGradient(cx,cy,cx+ox*0.3,cy-h);
  grad.addColorStop(0,col2); grad.addColorStop(0.2,col1); grad.addColorStop(1,'rgba(255,255,200,0)');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.moveTo(cx-w*0.5,cy);
  ctx.bezierCurveTo(cx-w*0.6,cy-h*0.3,cx+ox-w*0.3,cy-h*0.8,cx+ox,cy-h);
  ctx.bezierCurveTo(cx+ox+w*0.3,cy-h*0.8,cx+w*0.6,cy-h*0.3,cx+w*0.5,cy);
  ctx.closePath(); ctx.fill();
}

function drawOilDrum(x,y,fi,shielded,scale){
  scale=scale||1; var s=scale;
  var sway=Math.sin(tick*0.07+x*0.01)*1.5, flicker=Math.sin(tick*0.13+x*0.02)*0.5+0.5;
  var shieldRatio=shielded?(shieldT/MAX_SHIELD):0;
  var dW=13*s, dH=46*s, dY=y-18*s;

  var gg=ctx.createRadialGradient(x,y+18*s,0,x,y+18*s,(48+fi*28)*s);
  gg.addColorStop(0,'rgba(255,120,0,'+(0.14+fi*0.2)+')'); gg.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y+18*s,(68+fi*22)*s,0,6.28); ctx.fill();

  [x-14*s,x+14*s].forEach(function(wx){
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(wx,y+18*s,9*s,0,6.28); ctx.fill();
    ctx.strokeStyle='#6B4010'; ctx.lineWidth=3*s; ctx.beginPath(); ctx.arc(wx,y+18*s,9*s,0,6.28); ctx.stroke();
    ctx.strokeStyle='#c8901a'; ctx.lineWidth=1.5*s;
    for(var sp=0;sp<6;sp++){var a=sp*1.047+tick*0.035;ctx.beginPath();ctx.moveTo(wx,y+18*s);ctx.lineTo(wx+Math.cos(a)*7*s,y+18*s+Math.sin(a)*7*s);ctx.stroke();}
    ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(wx,y+18*s,2.2*s,0,6.28); ctx.fill();
  });
  ctx.strokeStyle='#4a2800'; ctx.lineWidth=3*s; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-14*s,y+18*s); ctx.lineTo(x+14*s,y+18*s); ctx.stroke();

  var bg=ctx.createLinearGradient(x-dW,dY,x+dW,dY);
  bg.addColorStop(0,'#141414');bg.addColorStop(0.18,'#2e2e2e');bg.addColorStop(0.45,'#484848');bg.addColorStop(0.72,'#282828');bg.addColorStop(1,'#0e0e0e');
  ctx.fillStyle=bg; ctx.beginPath(); ctx.roundRect(x-dW,dY,dW*2,dH,2*s); ctx.fill();

  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+dW*0.4,dY+2*s); ctx.lineTo(x+dW*0.4,dY+dH-2*s); ctx.stroke();

  [{rx:x-6*s,ry:dY+5*s,rw:6*s,rh:4*s,ra:0.4},{rx:x+5*s,ry:dY+12*s,rw:5*s,rh:3*s,ra:-0.2},{rx:x-3*s,ry:dY+22*s,rw:4*s,rh:3*s,ra:0.1},{rx:x+4*s,ry:dY+32*s,rw:5*s,rh:3.5*s,ra:0.3},{rx:x-7*s,ry:dY+38*s,rw:3*s,rh:2.5*s,ra:-0.1},{rx:x+1*s,ry:dY+18*s,rw:3*s,rh:2*s,ra:0.5}].forEach(function(r){
    ctx.fillStyle='rgba(155,55,8,0.6)'; ctx.beginPath(); ctx.ellipse(r.rx,r.ry,r.rw,r.rh,r.ra,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(200,90,20,0.3)'; ctx.beginPath(); ctx.ellipse(r.rx-s,r.ry-0.5*s,r.rw*0.6,r.rh*0.5,r.ra,0,6.28); ctx.fill();
  });
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x-5*s,dY+28*s,4*s,3*s,-0.3,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+6*s,dY+8*s,3*s,2*s,0.2,0,6.28); ctx.fill();

  var bandCol=shielded?'rgba(100,200,255,0.85)':'#4a4a4a';
  [dY+7*s,dY+17*s,dY+28*s,dY+38*s].forEach(function(by2){
    ctx.strokeStyle=bandCol; ctx.lineWidth=2.5*s; ctx.beginPath(); ctx.moveTo(x-dW+1,by2); ctx.lineTo(x+dW-1,by2); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x-dW+1,by2); ctx.lineTo(x+dW-1,by2); ctx.stroke();
  });

  var topG=ctx.createLinearGradient(x-dW,dY-3*s,x+dW,dY+3*s);
  topG.addColorStop(0,'#202020');topG.addColorStop(0.5,'#505050');topG.addColorStop(1,'#181818');
  ctx.fillStyle=topG; ctx.beginPath(); ctx.ellipse(x,dY,dW,5*s,0,0,6.28); ctx.fill();
  ctx.strokeStyle='#5a5a5a'; ctx.lineWidth=1.5*s; ctx.beginPath(); ctx.ellipse(x,dY,dW,5*s,0,0,6.28); ctx.stroke();
  ctx.fillStyle='#777'; ctx.beginPath(); ctx.ellipse(x+4*s,dY-s,3*s,1.5*s,0,0,6.28); ctx.fill();
  ctx.fillStyle='#aaa'; ctx.beginPath(); ctx.ellipse(x+4*s,dY-1.5*s,1.5*s,0.8*s,0,0,6.28); ctx.fill();

  var ng=ctx.createRadialGradient(x,dY-s,0,x,dY-s,(7+fi*5)*s);
  ng.addColorStop(0,'rgba(255,180,0,'+(0.55+fi*0.4)+')'); ng.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle=ng; ctx.beginPath(); ctx.arc(x,dY-s,(10+fi*5)*s,0,6.28); ctx.fill();

  var bH=(40+fi*50+flicker*5)*s, fy=dY;
  flameTongue(x,         fy,(26+fi*14)*s,bH,      sway*2,    'rgba(200,20,0,'+(0.55+fi*0.25)+')','rgba(220,40,0,0.85)',sway);
  flameTongue(x-9*s-fi*4*s,fy,(16+fi*7)*s, bH*0.64,-4+sway*3,'rgba(255,60,0,'+(0.7+fi*0.2)+')', 'rgba(255,80,0,0.6)',sway);
  flameTongue(x+9*s+fi*4*s,fy,(16+fi*7)*s, bH*0.61, 4+sway*3,'rgba(255,70,0,'+(0.7+fi*0.2)+')', 'rgba(255,90,0,0.6)',sway);
  flameTongue(x,         fy,(20+fi*10)*s,bH*0.88, sway,     'rgba(255,130,0,'+(0.85+fi*0.1)+')','rgba(255,150,0,0.5)',sway);
  flameTongue(x,         fy,(13+fi*7)*s, bH*0.76, sway*0.6, 'rgba(255,210,0,'+(0.88+fi*0.1)+')','rgba(255,220,30,0.4)',sway);
  flameTongue(x-4*s,     fy,(9+fi*4)*s,  bH*0.66,-1+sway*2, 'rgba(255,180,0,0.9)','rgba(255,200,20,0.3)',sway);
  flameTongue(x+4*s,     fy,(9+fi*4)*s,  bH*0.63, 1+sway*2, 'rgba(255,190,0,0.9)','rgba(255,210,20,0.3)',sway);
  flameTongue(x,         fy,(6+fi*3)*s,  bH*0.5,  sway*0.3, 'rgba(255,255,160,0.96)','rgba(255,255,230,0.2)',sway);
  flameTongue(x+sway*2,  fy,(3+fi*2)*s,  bH*0.36, sway,     'rgba(255,255,240,0.98)','rgba(255,255,255,0.05)',sway);

  for(var i=0;i<3+Math.round(fi*12);i++){
    var prog=((tick*0.028+i*0.22+x*0.002)%1);
    var ex=x+Math.sin(i*2.4+tick*0.05)*(11+fi*13)*s*prog, ey=dY-prog*(52+fi*48)*s;
    ctx.fillStyle='rgba(255,'+(160+Math.floor(flicker*90))+',0,'+(1-prog)*0.95+')';
    ctx.beginPath(); ctx.arc(ex,ey,(1+fi)*s*(1-prog*0.55),0,6.28); ctx.fill();
  }
  var tgr=ctx.createRadialGradient(x+sway*3,dY-bH*0.5,0,x+sway*3,dY-bH*0.3,(20+fi*16+flicker*5)*s);
  tgr.addColorStop(0,'rgba(255,210,70,'+(0.18+fi*0.25)+')'); tgr.addColorStop(1,'rgba(255,110,0,0)');
  ctx.fillStyle=tgr; ctx.beginPath(); ctx.arc(x+sway*3,dY-bH*0.44,(44+fi*18)*s,0,6.28); ctx.fill();

  if(shielded){
    var startA=-Math.PI/2, endA=startA+shieldRatio*Math.PI*2;
    var r2=1-shieldRatio, sr=Math.round(r2*r2*255), sg=Math.round((1-r2*r2)*200), sb=Math.round((1-r2)*255);
    ctx.strokeStyle='rgba(50,100,150,0.3)'; ctx.lineWidth=4*s; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(x,y-8*s,32*s,0,6.28); ctx.stroke();
    ctx.strokeStyle='rgba('+sr+','+sg+','+sb+',0.92)'; ctx.lineWidth=4*s; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(x,y-8*s,32*s,startA,endA); ctx.stroke();
    var pulse=0.5+Math.sin(tick*0.15)*0.3;
    ctx.strokeStyle='rgba(100,200,255,'+((0.3+pulse*0.25)*shieldRatio)+')'; ctx.lineWidth=2*s; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.arc(x,y-8*s,35*s,0,6.28); ctx.stroke(); ctx.setLineDash([]);
    var secs=Math.ceil(shieldT/60);
    ctx.fillStyle='rgba(150,230,255,'+(0.65+shieldRatio*0.3)+')'; ctx.font='bold '+(10*s)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(secs+'s',x,y+30*s); ctx.textBaseline='alphabetic';
  }
}

function draw(){
  ctx.save();
  // Clear canvas and draw sky background
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0d0500'); sky.addColorStop(0.55,'#1a0900'); sky.addColorStop(1,'#2a1200');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // Stars
  stars.forEach(function(st){ ctx.fillStyle='rgba(255,230,180,'+(0.3+st.sp*4)+')'; ctx.beginPath(); ctx.arc(st.x,st.y+(tick*st.sp)%H,st.r,0,6.28); ctx.fill(); });
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }
  ctx.fillStyle='rgba(255,240,180,0.12)'; ctx.beginPath(); ctx.arc(W-80,44,28,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,220,140,0.22)'; ctx.beginPath(); ctx.arc(W-80,44,18,0,6.28); ctx.fill();

  ctx.fillStyle='#1a0a00';
  [[50,H-80,80,66],[160,H-100,60,86],[520,H-70,90,56],[440,H-88,60,74],[620,H-58,50,44]].forEach(function(b){
    ctx.fillRect(b[0],b[1],b[2],b[3]);
    ctx.beginPath();ctx.moveTo(b[0]-4,b[1]);ctx.lineTo(b[0]+b[2]/2,b[1]-16);ctx.lineTo(b[0]+b[2]+4,b[1]);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,200,50,0.1)'; ctx.fillRect(b[0]+b[2]/2-5,b[1]+10,10,10);
    ctx.fillStyle='#1a0a00';
  });

  tumbleweeds.forEach(function(tw){
    ctx.save(); ctx.translate(tw.x,tw.y); ctx.rotate(tw.a);
    ctx.strokeStyle='rgba(140,90,30,0.65)'; ctx.lineWidth=1.5;
    for(var i=0;i<6;i++){var a=i*1.047;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*tw.r,Math.sin(a)*tw.r);ctx.stroke();}
    ctx.beginPath(); ctx.arc(0,0,tw.r,0,6.28); ctx.stroke();
    ctx.restore();
  });

  ctx.fillStyle='#2a1000'; ctx.fillRect(0,H-14,W,14);
  for(var i=0;i<W;i+=24){ ctx.fillStyle='#3a1800'; ctx.fillRect(i,H-14,12,5); }

  for(var i=0;i<allies.length;i++){
    var al=allies[i];
    if(Math.abs(al.x-px)>30){
      drawOilDrum(al.x,al.y,al.fi,false,0.42);
      // Show upgrade badge above ally
      if(al.upgrade){
        var upObj=ALLY_UPGRADES.find(function(u){return u.id===al.upgrade;});
        if(upObj){
          ctx.font='10px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(upObj.ico, al.x, al.y-48*0.42-8);
          ctx.textBaseline='alphabetic';
        }
      }
    }
    ctx.fillStyle='#ffcc00';
    for(var j=0;j<al.bullets.length;j++){ var b=al.bullets[j]; ctx.beginPath(); ctx.arc(b.x,b.y,3,0,6.28); ctx.fill(); }
  }


  var dcols={shield:'#44aaff',life:'#ff4466',bomb:'#ff8800',score:'#ffd700'};
  drops.forEach(function(d){
    ctx.fillStyle=dcols[d.type]||'#fff'; ctx.beginPath(); ctx.arc(d.x,d.y,9,0,6.28); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(d.ico||'?',d.x,d.y);
  });
  ctx.textBaseline='alphabetic';

  drawGarbageBoss();
  enemies.forEach(drawEnemy);

  var bw=hp('big')?8:3;
  bullets.forEach(function(b){
    ctx.fillStyle=hp('big')?'#ff8800':hp('ghost')?'rgba(200,200,255,0.8)':'#ffd700';
    ctx.fillRect(b.x-bw/2,b.y-7,bw,13);
  });
  ctx.fillStyle='#ff5533';
  ebullets.forEach(function(b){ ctx.beginPath(); ctx.arc(b.x,b.y,3.5,0,6.28); ctx.fill(); });

  drawOilDrum(px,py,fireIntensity,shieldT>0,1);

  if(flash>0&&flash%3<2){ ctx.fillStyle='rgba(255,30,30,0.22)'; ctx.fillRect(0,0,W,H); }
  if(mutlv>0){ ctx.fillStyle='rgba(160,50,255,'+Math.min(0.04+mutlv*0.035,0.2)+')'; ctx.fillRect(0,0,W,H); }
  if(nukeCount>0){ ctx.fillStyle='#ff8800'; ctx.font='11px "Special Elite",monospace'; ctx.textAlign='left'; ctx.fillText('💣 x'+nukeCount+' (N)',8,H-20); }
  if(goldBank>0){ ctx.fillStyle='#ffd700'; ctx.font='11px "Special Elite",monospace'; ctx.textAlign='left'; ctx.fillText('🪙 x'+goldBank+' gold (U/🔧)',8,H-6); }
  if(bossCountdown>0){
    var bcSecs=Math.ceil(bossCountdown/60);
    ctx.fillStyle='rgba(255,60,0,'+(0.6+Math.sin(tick*0.2)*0.2)+')';
    ctx.font='bold 13px "Rye",serif'; ctx.textAlign='right';
    ctx.fillText('BOSS IN '+bcSecs+'s',W-10,24);
    ctx.textAlign='left';
  }
  ctx.restore();
}

function openPerks(){
  if(gameInterval){clearInterval(gameInterval);gameInterval=null;} running=false;
  var pool=PERKS.filter(function(p){return p.stack||perks.indexOf(p.id)<0;});
  var picks=pool.sort(function(){return Math.random()-0.5;}).slice(0,4);
  var pl=document.getElementById('pcards'); pl.innerHTML='';
  picks.forEach(function(pk){
    var owned=perkCounts[pk.id]||0;
    var d=document.createElement('div'); d.className='pcard';
    d.innerHTML='<span class="pico">'+pk.ico+'</span><b>'+pk.n+(owned>0?' x'+(owned+1):'')+'</b><span>'+pk.d+'</span>';
    d.onclick=function(){
      if(perks.indexOf(pk.id)<0) perks.push(pk.id);
      perkCounts[pk.id]=(perkCounts[pk.id]||0)+1;
      if(pk.id==='life'&&lives<9)lives++;
      if(pk.id==='slow')slowStack++;if(pk.id==='speed')speedStack++;if(pk.id==='fury')furyStack++;
      if(pk.id==='backstep')stepStack++;if(pk.id==='leech')leechStack++;if(pk.id==='tough')toughHP+=1;if(pk.id==='nuke')nukeCount++;
      document.getElementById('perkscreen').style.display='none';
      nextWave();
    };
    pl.appendChild(d);
  });
  document.getElementById('perkscreen').style.display='flex';
}

function nextWave(){ wave++; mutlv=Math.floor(wave/3); spawnWave(); startLoop(); hud(); }

function endGame(){
  if(gameInterval){clearInterval(gameInterval);gameInterval=null;} stopMusic(); running=false;
  scores.push({s:score,w:wave}); scores.sort(function(a,b){return b.s-a.s;}); scores=scores.slice(0,8);
  renderLB();
  document.getElementById('overlay').querySelector('h2').textContent='⚰ SUNDOWN ⚰';
  document.getElementById('overlay').querySelector('p').textContent='Wave '+wave+' — Score: '+score.toLocaleString()+'\nThe scrap keeps piling up...';
  document.getElementById('startbtn').textContent='RIDE AGAIN';
  document.getElementById('overlay').style.display='flex';
}

function renderLB(){
  var tb=document.getElementById('lbbody');
  tb.innerHTML='<tr><td colspan="3" style="font-family:Rye,serif;color:#ffd700;font-size:13px;border-bottom:2px solid #8B5E1A;padding:4px 8px">Hall of Fame</td></tr>';
  if(!scores.length){tb.innerHTML+='<tr><td colspan="3" style="color:#555;padding:6px">No scores yet</td></tr>';return;}
  scores.forEach(function(r,i){ tb.innerHTML+='<tr><td>'+(i+1)+'.</td><td>Wave '+r.w+'</td><td>'+r.s.toLocaleString()+'</td></tr>'; });
}

function startLoop(){
  if(gameInterval) clearInterval(gameInterval);
  running=true; startMusic();
  gameInterval=setInterval(function(){update();draw();},1000/60);
}

// ═══════════════════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════════════════
document.addEventListener('keydown',function(e){
  kb[e.code]=true;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.code)>=0) e.preventDefault();
  if(e.code==='KeyN'&&nukeCount>0&&running){nukeCount--;nukeClear();}
  if(e.code==='KeyU'&&running){var ni=nearestAlly();if(ni!==null)upgradeAlly(ni);}
});
document.addEventListener('keyup',function(e){ kb[e.code]=false; });

function holdBtn(el,prop){
  el.addEventListener('touchstart',function(e){e.preventDefault();touch[prop]=true;},{passive:false});
  el.addEventListener('touchend',  function(e){e.preventDefault();touch[prop]=false;});
  el.addEventListener('touchcancel',function(e){e.preventDefault();touch[prop]=false;});
  el.addEventListener('mousedown', function(e){e.preventDefault();touch[prop]=true;});
  el.addEventListener('mouseup',   function(){touch[prop]=false;});
  el.addEventListener('mouseleave',function(){touch[prop]=false;});
}
holdBtn(document.getElementById('btnL'),    'left');
holdBtn(document.getElementById('btnR'),    'right');
holdBtn(document.getElementById('shootbtn'),'shoot');

// Upgrade button (appears when gold available)
var upgbtn=document.createElement('button');
upgbtn.className='cbtn';upgbtn.textContent='🔧';upgbtn.style.cssText='display:none;font-size:20px';
upgbtn.title='Upgrade nearest ally (costs 1 gold)';
document.getElementById('controls').appendChild(upgbtn);
upgbtn.addEventListener('touchstart',function(e){e.preventDefault();if(goldBank>0&&running){var ni=nearestAlly();if(ni!==null)upgradeAlly(ni);}},{passive:false});
upgbtn.addEventListener('click',function(){if(goldBank>0&&running){var ni=nearestAlly();if(ni!==null)upgradeAlly(ni);}});
setInterval(function(){
  upgbtn.style.display=(goldBank>0&&running)?'flex':'none';
  if(goldFirstNudgeTick>0){ goldFirstNudgeTick--; upgbtn.classList.add('gold-nudge'); }
  else upgbtn.classList.remove('gold-nudge');
},250);

// Dynamite button (appears when you have nukes)
var nukebtn=document.createElement('button');
nukebtn.className='cbtn'; nukebtn.textContent='💣'; nukebtn.style.display='none';
document.getElementById('controls').insertBefore(nukebtn,document.getElementById('shootbtn'));
nukebtn.addEventListener('touchstart',function(e){e.preventDefault();if(nukeCount>0&&running){nukeCount--;nukeClear();}},{passive:false});
nukebtn.addEventListener('click',function(){if(nukeCount>0&&running){nukeCount--;nukeClear();}});
setInterval(function(){nukebtn.style.display=nukeCount>0?'flex':'none';},250);

// Volume controls
document.getElementById('mutebtn').onclick=function(){
  resumeAC(); muted=!muted; this.textContent=muted?'🔇 Unmute':'🔊 Mute';
  if(musicGain) musicGain.gain.value=muted?0:masterVol;
  if(sfxGain)   sfxGain.gain.value  =muted?0:sfxVol;
};
document.getElementById('vol').oninput=function(){
  masterVol=parseFloat(this.value); if(musicGain&&!muted) musicGain.gain.value=masterVol;
};
document.getElementById('sfxvol').oninput=function(){
  sfxVol=parseFloat(this.value); if(sfxGain&&!muted) sfxGain.gain.value=sfxVol;
};

// Start button
document.getElementById('startbtn').onclick=function(){
  initAudio(); resumeAC();
  document.getElementById('overlay').style.display='none';
  document.getElementById('perkscreen').style.display='none';
  reset(); startLoop();
};

// Boot
renderLB();
draw();
</script>
